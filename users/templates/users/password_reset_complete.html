<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .login-container {
            background: #fff;
            color: #333;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transition: all 0.3s ease-in-out;
        }
        .login-container:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .login-container h2 {
            margin-bottom: 2.5rem;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2575fc;
        }
        .login-container form {
            display: flex;
            flex-direction: column;
        }
        .login-container label {
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: #333;
            text-align: left;
        }
        .login-container input {
            padding: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: 0.3s;
        }
        .login-container input:focus {
            border-color: #2575fc;
            outline: none;
            box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        }
        .login-container button {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: #fff;
            padding: 0.8rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s, transform 0.2s;
        }
        .login-container button:hover {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            transform: translateY(-2px);
        }
        .messages {
            margin-top: 1rem;
            list-style: none;
            padding: 0;
        }
        .messages li {
            padding: 0.6rem;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        .messages .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .messages .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .heading {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 120px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
            color: #fff;
        }
        img{
            height: auto;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="https://cxstrategy.in/img/partners/iccs.png">
        <h2>Password Reset Complete</h2>
        <p>Your password has been successfully reset.</p>
        <p><a href="{% url 'user_login' %}">Click here to log in</a></p>
    </div>
</body>
</html>
